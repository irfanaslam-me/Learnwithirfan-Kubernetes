apiVersion: v1
kind: pod
metadata:
  name: pod-with-storage
spec:
  containers:
  - name: volume-container
    image: busybox
    command: ["sleep", "3600"]
    volumeMounts:
    - name: demo-volume
      mountPath: "/data"
      name: storage-volume
  volumes:
  - name: storage-volume
    persistentVolumeClaim:
      claimName: demo-pvc